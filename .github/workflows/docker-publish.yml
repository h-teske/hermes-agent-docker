name: Build and Publish Docker Image

on:
  schedule:
    # Check for new upstream releases every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version tag to build (e.g., v2026.3.30)"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "upstream-version.json"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_REPO: NousResearch/hermes-agent

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Determine version to build
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            VERSION=$(curl -sf \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest" \
              | jq -r '.tag_name')
          else
            # Push event – read version from tracked file (Renovate flow)
            VERSION=$(jq -r '.version' upstream-version.json)
          fi
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "::error::Failed to determine version to build"
            exit 1
          fi
          # Validate VERSION is a safe git tag (e.g., v2026.3.30)
          if [[ ! "$VERSION" =~ ^v[0-9][0-9a-zA-Z._-]+$ ]]; then
            echo "::error::Invalid version format: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Building version \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists in GHCR
        id: check
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          status=0
          output="$(docker manifest inspect "${IMAGE}" 2>&1)" || status=$?
          if [[ "$status" -eq 0 ]]; then
            echo "Image **${VERSION}** already exists – skipping build" >> "$GITHUB_STEP_SUMMARY"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$output" | grep -qiE 'manifest unknown|not found|no such manifest'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected error checking manifest for ${IMAGE}: ${output}"
            exit "$status"
          fi

      - name: Clone upstream source at tag
        if: steps.check.outputs.exists != 'true'
        run: |
          git clone --depth 1 --branch "${{ steps.version.outputs.version }}" \
            "https://github.com/${{ env.UPSTREAM_REPO }}.git" upstream

      - name: Patch upstream Dockerfile (add matrix-nio e2e dependencies)
        if: steps.check.outputs.exists != 'true'
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, sys

          with open('upstream/Dockerfile', 'r') as f:
              content = f.read()

          # Patch 1: inject `git` before the first `npm install` so npm can
          # resolve git-protocol dependencies (upstream image omits git).
          npm_match = re.search(r'\nRUN npm install\b', content)
          if npm_match:
              git_patch = "\nRUN apt-get update && apt-get install -y git && rm -rf /var/lib/apt/lists/*\n"
              content = content[:npm_match.start()] + git_patch + content[npm_match.start():]
              print("Patch 1 applied: git installed before npm install")
          else:
              print("WARNING: no 'npm install' found – skipping git patch", file=sys.stderr)

          # Patch 2: install mautrix before the last CMD/ENTRYPOINT.
          # The upstream Dockerfile switches to a non-root USER before the
          # ENTRYPOINT, so we must temporarily switch back to root for apt+pip
          # and then restore the original USER (if any) so the runtime user
          # is unchanged.
          matches = list(re.finditer(r'\n(?:CMD|ENTRYPOINT)\b', content))
          insert_at = matches[-1].start() if matches else len(content)
          prior = content[:insert_at]
          user_matches = list(re.finditer(r'(?m)^USER\s+(\S+)', prior))
          prior_user = user_matches[-1].group(1) if user_matches else None
          mautrix_patch = (
              "\nUSER root\n"
              "RUN apt-get update && apt-get install -y python3 python3-pip"
              " && rm -rf /var/lib/apt/lists/*\n"
              "RUN python3 -m pip install --break-system-packages mautrix\n"
          )
          if prior_user is not None:
              mautrix_patch += f"USER {prior_user}\n"
          content = prior + mautrix_patch + content[insert_at:]
          user_note = f"restored USER={prior_user}" if prior_user is not None else "no prior USER directive"
          if matches:
              print(f"Patch 2 applied: mautrix added ({user_note})")
          else:
              print(f"WARNING: no CMD/ENTRYPOINT found – appended mautrix patch at end ({user_note})", file=sys.stderr)

          with open('upstream/Dockerfile', 'w') as f:
              f.write(content)

          print("Dockerfile patched successfully")
          PYEOF

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Extract Docker metadata
        if: steps.check.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            ${{ github.event_name != 'workflow_dispatch' && 'type=raw,value=latest' || '' }}
          labels: |
            org.opencontainers.image.title=hermes-agent
            org.opencontainers.image.description=Docker image for NousResearch/hermes-agent
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPO }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: ./upstream
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max

      - name: Summary
        if: steps.check.outputs.exists != 'true'
        run: |
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
