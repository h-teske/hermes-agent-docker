name: Build and Publish Docker Image

on:
  schedule:
    # Check for new upstream releases every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version tag to build (e.g., v2026.3.30)"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "upstream-version.json"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_REPO: NousResearch/hermes-agent

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Determine version to build
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            VERSION=$(curl -sf \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest" \
              | jq -r '.tag_name')
          else
            # Push event – read version from tracked file (Renovate flow)
            VERSION=$(jq -r '.version' upstream-version.json)
          fi
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "::error::Failed to determine version to build"
            exit 1
          fi
          # Validate VERSION is a safe git tag (e.g., v2026.3.30)
          if [[ ! "$VERSION" =~ ^v[0-9][0-9a-zA-Z._-]+$ ]]; then
            echo "::error::Invalid version format: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Building version \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists in GHCR
        id: check
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          status=0
          output="$(docker manifest inspect "${IMAGE}" 2>&1)" || status=$?
          if [[ "$status" -eq 0 ]]; then
            echo "Image **${VERSION}** already exists – skipping build" >> "$GITHUB_STEP_SUMMARY"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$output" | grep -qiE 'manifest unknown|not found|no such manifest'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected error checking manifest for ${IMAGE}: ${output}"
            exit "$status"
          fi

      - name: Clone upstream source at tag
        if: steps.check.outputs.exists != 'true'
        run: |
          git clone --depth 1 --branch "${{ steps.version.outputs.version }}" \
            "https://github.com/${{ env.UPSTREAM_REPO }}.git" upstream

      - name: Patch upstream Dockerfile (add matrix-nio e2e dependencies)
        if: steps.check.outputs.exists != 'true'
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, sys

          with open('upstream/Dockerfile', 'r') as f:
              content = f.read()

          patch = (
              "\nRUN apt-get update && apt-get install -y libolm-dev"
              " && rm -rf /var/lib/apt/lists/*\n"
              "RUN pip install 'matrix-nio[e2e]'\n"
          )

          # Insert patch before the last CMD or ENTRYPOINT instruction
          new_content, n = re.subn(
              r'(\n(?:CMD|ENTRYPOINT)\b)',
              patch + r'\1',
              content,
              count=1,
          )
          if n == 0:
              print("WARNING: no CMD/ENTRYPOINT found – appending patch at end of Dockerfile", file=sys.stderr)
              new_content = content + patch

          with open('upstream/Dockerfile', 'w') as f:
              f.write(new_content)

          print("Dockerfile patched successfully")
          PYEOF

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract Docker metadata
        if: steps.check.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            ${{ github.event_name != 'workflow_dispatch' && 'type=raw,value=latest' || '' }}
          labels: |
            org.opencontainers.image.title=hermes-agent
            org.opencontainers.image.description=Docker image for NousResearch/hermes-agent
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPO }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./upstream
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: steps.check.outputs.exists != 'true'
        run: |
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
